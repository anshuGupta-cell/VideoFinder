<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Search videos across supported websites."
  />
  <title>VideoFinder</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="header">
    <a class="logo" href="/">VideoFinder</a>
    <label class="data-saver">
      <input id="dataSaver" type="checkbox" checked />
      <span>Data Saver</span>
    </label>
  </header>

  <main class="container">
    <section class="search-panel">
      <h1>Find videos</h1>
      <p>Search supported websites from one place.</p>

      <form id="searchForm">
        <input
          id="query"
          type="search"
          placeholder="Enter search terms..."
          maxlength="200"
          required
        />

        <select id="site">
          <option value="all">All sites</option>
          <option value="pornhub">Pornhub</option>
          <option value="xhamster">xHamster</option>
        </select>

        <button id="searchButton" type="submit">Search</button>
      </form>
    </section>

    <div id="status" class="status" role="status" aria-live="polite">
      Enter a search query to begin.
    </div>

    <section id="results" class="results" aria-label="Search results"></section>

    <button id="loadMore" class="load-more" type="button" hidden>
      Load More
    </button>
  </main>

  <footer>
    VideoFinder displays metadata and preview URLs returned by supported sites.
  </footer>
</body>
</html>
